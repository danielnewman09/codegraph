[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph"
version = "0.2.0"
description = "Shared Neo4j codebase graph data model — Pydantic models for File, Namespace, Compound, Member, and Parameter nodes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Daniel Newman" },
]
keywords = ["neo4j", "codegraph", "data-model", "codebase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "pydantic>=2.0",
    "neo4j",
    "jinja2>=3.0",
    "neomodel>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
codegraph-html = "codegraph.export.viz:main"
codegraph-db = "codegraph.persistence.db_cli:main"
codegraph-enrich = "codegraph_enrich.__main__:main"
codegraph-requirements = "codegraph_requirements.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "sphinx>=7.0"]
enrich = ["llm-caller"]

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph", "src/codegraph_enrich", "src/codegraph_requirements"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Neo4j",
]

[tool.coverage.run]
source = ["codegraph", "codegraph_enrich", "codegraph_requirements"]
omit = ["*/type_parser.py"]

[tool.coverage.report]
show_missing = true
fail_under = 75
