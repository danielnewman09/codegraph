[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph"
version = "0.2.0"
description = "Shared Neo4j codebase graph data model — Pydantic models for File, Namespace, Compound, Member, and Parameter nodes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Daniel Newman" },
]
keywords = ["neo4j", "codegraph", "data-model", "codebase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "pydantic>=2.0",
    "neo4j",
    "jinja2>=3.0",
    "neomodel>=5.0",
    "python-dotenv>=1.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.0",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
]

[project.scripts]
codegraph-html = "codegraph.export.viz:main"
codegraph-codegen = "codegraph.codegen.cli:main"
codegraph-db = "codegraph.persistence.db_cli:main"
codegraph-enrich = "codegraph_enrich.__main__:main"
codegraph-requirements = "codegraph_requirements.__main__:main"
codegraph-mine = "codegraph_mine.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "sphinx>=7.0", "playwright>=1.40"]
enrich = ["llm-caller"]
design = ["llm-caller"]

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph", "src/codegraph_design", "src/codegraph_enrich", "src/codegraph_requirements", "src/codegraph_mine", "src/codegraph_project", "src/codegraph_memory", "src/codegraph_feedback", "src/codegraph_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/backends"]
markers = [
    "integration: marks tests that exercise the full stack against a live backend (Neo4j-only unless otherwise noted)",
    "neo4j: marks tests that require a running Neo4j instance",
    "slow: marks tests that require an LLM call (OPENAI_API_KEY)",
    "browser: marks tests that require a Playwright headless browser",
]

[tool.coverage.run]
source = ["codegraph", "codegraph_design", "codegraph_enrich", "codegraph_requirements", "codegraph_mine", "codegraph_project", "codegraph_memory", "codegraph_feedback", "codegraph_agents"]
omit = ["*/type_parser.py"]

[tool.coverage.report]
show_missing = true
fail_under = 75
