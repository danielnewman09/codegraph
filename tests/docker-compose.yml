# Ephemeral Neo4j instance for the pytest session.
# The conftest starts this container before any tests run and tears it
# down when the session ends, so every test run gets a clean database.
#
# Ports 7688 (Bolt) / 7475 (HTTP) are offset from the dev container
# defaults so tests never interfere with a running dev instance.

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-codegraph-test
    ports:
      - "7688:7687"    # Bolt
      - "7475:7474"    # HTTP / Browser
    mem_limit: 2g
    environment:
      - NEO4J_AUTH=neo4j/codegraph-test
      - NEO4J_PLUGINS=[]
      # Heap: initial 256 MiB, hard ceiling at 1 GiB (test workload doesn't need more)
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=1g
      # Page cache: small — individual tests are tiny, and tmpfs storage is fast anyway
      - NEO4J_server_memory_pagecache_size=128m
      # Transaction log retention: keep only 1 file to bound tmpfs growth
      - NEO4J_db_tx__log_rotation_retention__policy=1 files
      # Prevent transaction log from growing unbounded between rotations
      - NEO4J_db_tx__log_rotation_size=50M
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | cypher-shell -u neo4j -p codegraph-test 2>/dev/null || exit 1"]
      interval: 2s
      timeout: 10s
      retries: 20
      start_period: 10s
